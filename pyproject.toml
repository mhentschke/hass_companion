[project]
name = "hass-companion"
dynamic = ["version"]
description = "A lightweight Home Assistant companion for Linux/macOS"
requires-python = ">=3.12"
dependencies = [
    "bidict>=0.23,<1.0",
    "ha-mqtt-discoverable>=0.24,<1.0",
    "paho-mqtt>=2.0,<3.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "psutil>=5.9",
]

[project.scripts]
hass-companion = "hass_companion.cli:main"

[tool.setuptools.dynamic]
version = {attr = "hass_companion.__version__"}

[tool.setuptools.packages.find]
include = ["hass_companion*", "core*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: requires Docker MQTT broker (deselect with -m 'not smoke')",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/smoke/*" = ["E501"]

[tool.coverage.run]
source = ["core"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if __name__"]
